# 💫 Name of the workflow shown in GitHub Actions UI
name: Solar System Workflow  

# 🚀 Workflow triggers
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'

jobs:
  # 🧪 JOB 1: Unit testing using multiple Node.js versions
  unit-testing:
    name: Unit testing
    runs-on: ubuntu-latest

    container:
      image: node:${{ matrix.nodejs_version }}

    services:
      mongo-db:
        image: siddharth67/mongo-db:non-prod
        options: --name mongo

    env:
      MONGO_URI: mongodb://mongo:27017/superData
      MONGO_USERNAME: non-prod-user
      MONGO_PASSWORD: non-prod-password

    strategy:
      matrix:
        nodejs_version: [18, 20]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🧠 Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ matrix.nodejs_version }}-${{ hashFiles('package-lock.json') }}

      - name: 📦 Install dependencies
        run: npm install

      - name: 🧪 Run unit tests
        run: npm test

      - name: 📤 Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mocha-Test-Result-${{ matrix.nodejs_version }}-${{ runner.os }}
          path: test-results.xml

  # ✅ JOB 2: Code coverage
  code-coverage:
    name: Code coverage
    runs-on: ubuntu-latest

    env:
      MONGO_URI: mongodb://non-prod-user:non-prod-password@mongo-db:27017/Github_Actions_Solar
      MONGO_USERNAME: non-prod-user
      MONGO_PASSWORD: non-prod-password

    services:
      mongo-db:
        image: bdockerfatnassi/mongo-db:non-prod
        ports:
          - 27017:27017

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: 🧠 Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ubuntu-node-18-${{ hashFiles('package-lock.json') }}

      - name: 📦 Install dependencies
        run: npm install

      - name: 🧪 Run unit tests (don’t fail if error)
        run: npm test || true

      - name: ✅ Run code coverage (don’t fail if error)
        run: npm run coverage || true

      - name: 📤 Upload coverage folder
        uses: actions/upload-artifact@v4
        with:
          name: Code-Coverage-Result
          path: coverage
          retention-days: 5

  # 🐳 JOB 3: Build and test Docker image
  docker:
    name: Containerization
    needs: [unit-testing, code-coverage]
    runs-on: ubuntu-latest

    env:
      MONGO_USERNAME: non-prod-user
      MONGO_PASSWORD: non-prod-password
      SHA_TAG: ${{ github.sha }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 DockerHub Login
        uses: docker/login-action@v2
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: 🔐 GHCR Login
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛠️ Build Docker image (no push)
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ env.SHA_TAG }}

      - name: 🧪 Test Docker image
        run: |
          docker run --name solar-system-app -d \
            -p 3000:3000 \
            -e MONGO_USERNAME=$MONGO_USERNAME \
            -e MONGO_PASSWORD=$MONGO_PASSWORD \
            ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ env.SHA_TAG }}

          wget -q -O - http://127.0.0.1:3000/live | grep live

      - name: 🛠️ Push Docker image to DockerHub
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ env.SHA_TAG }}
            ${{ vars.DOCKERHUB_USERNAME }}/solar-system:latest

      - name: 🛠️ Push Docker image to GHCR
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/bahaeddinef/solar-system:${{ github.sha }}
            ghcr.io/bahaeddinef/solar-system:latest '