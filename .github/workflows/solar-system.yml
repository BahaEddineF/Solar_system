# 💫 Nom du workflow
name: Solar System Workflow  

# 🚀 Déclenchement du workflow
on:
  # Lancement manuel
  workflow_dispatch:         
  # Push sur branches spécifiques
  push:                      
    branches:                
      - main
      - 'feature/*'

# 🌍 Variables d’environnement globales
env:
  MONGO_URI: 'mongodb+srv://cluster0.p0dlr.mongodb.net/Github_Actions_Solar'
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

# 🧪 Tâche : tests unitaires
jobs:
  unit-testing:              
    name: Unit testing

    # 🔁 Stratégie de test avec différentes versions de Node.js et OS
    strategy:
      matrix:
        nodejs_version: [18, 20]
        os: [ubuntu-latest, macos-latest]
        exclude:
          - nodejs_version: 18
            os: macos-latest

    # 🖥️ Choix du système d’exploitation selon la matrice
    runs-on: ${{ matrix.os }}

    steps:
      # 📥 Récupère le code du dépôt
      - name: checkout repo    
        uses: actions/checkout@v4

      # 🔧 Configure Node.js avec la version choisie
      - name: Setup NodeJs Version - ${{ matrix.nodejs_version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.nodejs_version }}

      # 📦 Installe les dépendances avec npm
      - name: Install Dependencies       
        run: npm install 

      # 🧪 Lance les tests unitaires
      - name: Unit Testing  
        id: nodejs-unit-test-step             
        run: npm test

      # 📤 Archive le fichier de résultats des tests
      - name: Archive Test result 
        if: steps.nodejs-unit-test-step.outcome == 'failure' || steps.nodejs-unit-test-step.outcome == 'success'    
        uses: actions/upload-artifact@v4
        with:
            name: Mocha-Test-Result-${{ matrix.nodejs_version }}-${{ matrix.os }}
            path: test-results.xml 
 
  code-coverage:                         # 🧪 Job : Analyse de la couverture de code
   name: Code-coverage
   runs-on: ubuntu-latest              # 🖥️ Utilise une machine Ubuntu

   steps:
    # 📥 Récupère le code du dépôt
    - name: checkout repo    
      uses: actions/checkout@v4

    # 🔧 Configure Node.js version 18
    - name: Setup NodeJs Version - 18
      uses: actions/setup-node@v3
      with:
        node-version: 18

    # 📦 Installe les dépendances avec npm
    - name: Install Dependencies       
      run: npm install 

    # 🧪 Lance les tests unitaires
    - name: Unit Testing               
      run: npm test

    # ✅ Lance la commande de couverture de code
    - name: Check code coverage
      continue-on-error: true         # Ne bloque pas le workflow si cette étape échoue
      run: npm run coverage

    # 📤 Archive le dossier de couverture (ex: HTML report)
    - name: Archive Test result        
      uses: actions/upload-artifact@v4
      with:
        name: Code-Coverage-Result
        path: coverage
        retention-days: 5


