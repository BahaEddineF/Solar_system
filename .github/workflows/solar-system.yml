# 💫 Nom du workflow
name: Solar System Workflow  

# 🚀 Déclenchement du workflow
on:
  # Lancement manuel
  workflow_dispatch:         
  # Push sur branches spécifiques
  push:                      
    branches:                
      - main
      - 'feature/*'

# 🌍 Variables d’environnement globales
env:
  MONGO_URI: 'mongodb+srv://cluster0.p0dlr.mongodb.net/Github_Actions_Solar'
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

# 🧪 Tâche : tests unitaires
jobs:
  unit-testing:              
    name: Unit testing

    # 🔁 Stratégie de test avec différentes versions de Node.js et OS
    strategy:
      matrix:
        nodejs_version: [18, 19, 20]
        os: [ubuntu-latest, macos-latest]
        exclude:
          - nodejs_version: 18
            os: macos-latest

    # 🖥️ Choix du système d’exploitation selon la matrice
    runs-on: ${{ matrix.os }}

    steps:
      # 📥 Récupère le code du dépôt
      - name: checkout repo    
        uses: actions/checkout@v4

      # 🔧 Configure Node.js avec la version choisie
      - name: Setup NodeJs Version - ${{ matrix.nodejs_version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.nodejs_version }}

      # 📦 Installe les dépendances avec npm
      - name: Install Dependencies       
        run: npm install 

      # 🧪 Lance les tests unitaires
      - name: Unit Testing               
        run: npm test

      # 📤 Archive le fichier de résultats des tests
      - name: Archive Test result        
        uses: actions/upload-artifact@v4
        with:
            name: Mocha-Test-Result-${{ matrix.nodejs_version }}-${{ matrix.os }}
            path: test-results.xml 
 
