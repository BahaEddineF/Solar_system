# 💫 Name of the workflow shown in GitHub Actions UI
name: Solar System Workflow  

# 🚀 Workflow triggers
on:
  workflow_dispatch:         # Manual trigger from GitHub UI
  push:                      # Automatic trigger when pushing code
    branches:
      - main                 # On the main branch
      - 'feature/*'          # Or any branch starting with "feature/"

# 🌍 Global environment variables (available for all jobs)
env:
  MONGO_URI: 'mongodb+srv://cluster0.p0dlr.mongodb.net/Github_Actions_Solar'
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}     # GitHub variable
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}  # GitHub secret

# 🧪 JOB 1: Unit testing using multiple Node.js versions
jobs:
  unit-testing:
    name: Unit testing

    strategy:
      matrix:
        nodejs_version: [18, 20]   # Test with Node.js versions 18 and 20
        os: [ubuntu-latest]        # Only run on Ubuntu

    runs-on: ${{ matrix.os }}      # Use OS defined in matrix

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.nodejs_version }}

      - name: 🧠 Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ matrix.nodejs_version }}-${{ hashFiles('package-lock.json') }}

      - name: 📦 Install dependencies
        run: npm install

      - name: 🧪 Run unit tests
        id: nodejs-unit-test-step
        run: npm test

      - name: 📤 Upload test results
        if: always()   # Run this step even if tests fail
        uses: actions/upload-artifact@v4
        with:
          name: Mocha-Test-Result-${{ matrix.nodejs_version }}-${{ matrix.os }}
          path: test-results.xml

# ✅ JOB 2: Code coverage calculation
  code-coverage:
    name: Code-coverage
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Install Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: 🧠 Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ubuntu-node-modules-18-${{ hashFiles('package-lock.json') }}

      - name: 📦 Install dependencies
        run: npm install

      - name: 🧪 Run unit tests (don’t fail if error)
        run: npm test || true

      - name: ✅ Run code coverage (don’t fail if error)
        run: npm run coverage || true

      - name: 📤 Upload coverage folder
        uses: actions/upload-artifact@v4
        with:
          name: Code-Coverage-Result
          path: coverage
          retention-days: 5

# 🐳 JOB 3: Build and test Docker image
  docker:
    name: Containerization
    needs: [unit-testing, code-coverage]   # Wait for previous 2 jobs to finish
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 DockerHub Login
        uses: docker/login-action@v2
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: 🔐 GHCR Login
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}    

      - name: 🛠️ Build Docker image (no push)
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}

      - name: 🧪 Test the Docker image
        run: |
          docker images   # Show local Docker images

          # Run the app container
          docker run --name solar-system-app -d \
              -p 3000:3000 \
              -e MONGO_USERNAME=$MONGO_USERNAME \
              -e MONGO_PASSWORD=$MONGO_PASSWORD \
              ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}

          # Get the container internal IP
          export IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)
          echo "Container IP: $IP"

          # Test if app responds at /live
          echo "🌐 Testing /live endpoint"
          wget -q -O - http://127.0.0.1:3000/live | grep live

      - name: 🛠️ Container Registry Push
        uses: docker/build-push-action@v4
        with:
            context: .
            push: true
            tags: |
                ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
                ghcr.io/${{ github.repository_owner }}/solar-system:latest


      # - name: 🛠️ Push Docker image to DockerHub
      #   uses: docker/build-push-action@v4
      #   with:
      #     context: .
      #     push: true
      #     tags: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
