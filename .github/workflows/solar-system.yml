name: Solar System Workflow  # 💫 Nom du workflow

on:
  workflow_dispatch:         # 🚀 Lancement manuel possible
  push:                      # 📦 Se déclenche lors d'un push...
    branches:                # ...sur les branches main ou feature/*
      - main
      - 'feature/*'
env:
    MONGO_URI: 'mongodb+srv://cluster0.p0dlr.mongodb.net/Github_Actions_Solar'
    MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
    MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
jobs:
  unit-testing:              # 🧪 Tâche : test unitaire
    name: Unit testing
    runs-on: ubuntu-latest   # 🖥️ Utilise une machine Ubuntu

    steps:
    - name: checkout repo    # 📥 Récupère le code du dépôt
      uses: actions/checkout@v4

    - name: Setup NodeJs Version - 18  # 🔧 Configure Node.js v18
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install Dependencies       # 📦 Installe les dépendances npm
      run: npm install 

    - name: Unit Testing               # 🧪 Lance les tests unitaires
      run: npm test
