# 💫 Nom du workflow visible sur GitHub Actions
name: Solar System Workflow  

# 🚀 Déclencheurs du workflow
on:
  workflow_dispatch:         # Lancement manuel via l'interface GitHub
  push:                      # Lancement automatique lors d'un push
    branches:
      - main                 # ...sur la branche main
      - 'feature/*'          # ...ou une branche qui commence par "feature/"

# 🌍 Variables d'environnement (accessibles dans tous les jobs)
env:
  MONGO_URI: 'mongodb+srv://cluster0.p0dlr.mongodb.net/Github_Actions_Solar'
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}     # variable GitHub
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}  # secret GitHub

# 🧪 JOB 1 : Tests unitaires avec plusieurs versions de Node.js
jobs:
  unit-testing:
    name: Unit testing

    strategy:
      matrix:
        nodejs_version: [18, 20]   # Teste avec Node.js 18 et 20
        os: [ubuntu-latest]        # Sur OS Ubuntu uniquement

    runs-on: ${{ matrix.os }}      # Exécute sur l'OS défini dans le matrix

    steps:
      - name: 📥 Récupère le code
        uses: actions/checkout@v4

      - name: 🔧 Installe Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.nodejs_version }}

      - name: 🧠 Met en cache les dépendances npm
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ matrix.nodejs_version }}-${{ hashFiles('package-lock.json') }}

      - name: 📦 Installe les dépendances
        run: npm install

      - name: 🧪 Lance les tests unitaires
        id: nodejs-unit-test-step
        run: npm test

      - name: 📤 Archive les résultats des tests
        if: always()   # Exécute cette étape même si les tests échouent
        uses: actions/upload-artifact@v4
        with:
          name: Mocha-Test-Result-${{ matrix.nodejs_version }}-${{ matrix.os }}
          path: test-results.xml

# ✅ JOB 2 : Couverture de code (Code Coverage)
  code-coverage:
    name: Code-coverage
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupère le code
        uses: actions/checkout@v4

      - name: 🔧 Installe Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: 🧠 Met en cache les dépendances npm
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ubuntu-node-modules-18-${{ hashFiles('package-lock.json') }}

      - name: 📦 Installe les dépendances
        run: npm install

      - name: 🧪 Lance les tests (même s’ils échouent)
        run: npm test || true

      - name: ✅ Calcule la couverture du code
        run: npm run coverage || true

      - name: 📤 Archive le rapport de couverture
        uses: actions/upload-artifact@v4
        with:
          name: Code-Coverage-Result
          path: coverage
          retention-days: 5

# 🐳 JOB 3 : Création et test d’une image Docker
  docker:
    name: Containerization
    needs: [unit-testing, code-coverage]   # Attend que les 2 jobs précédents soient finis
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupère le code
        uses: actions/checkout@v4

      - name: 🔐 Connexion à DockerHub
        uses: docker/login-action@v2.2.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: 🛠️ Build Docker (mais ne le pousse pas)
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}

      - name: 🧪 Test de l'image Docker
        run: |
          docker images   # Affiche les images locales

          # Lance le container de test avec les bonnes variables
          docker run --name solar-system-app -d \
              -p 3000:3000 \
              -e MONGO_USERNAME=$MONGO_USERNAME \
              -e MONGO_PASSWORD=$MONGO_PASSWORD \
              ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}

          # Récupère l’IP interne du container
          export IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)
          echo "Container IP: $IP"

          # Teste si le service répond bien à l’URL /live
          echo "🌐 Testing /live endpoint"
          wget -q -O - http://127.0.0.1:3000/live | grep live

      - name: 🛠️ Push Docker 
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
